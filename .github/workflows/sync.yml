name: Sync
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '0 2 * * 1,4'
  workflow_dispatch:
concurrency:
  group: sync
  cancel-in-progress: true
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 'latest'
      - run: bun i --ignore-scripts && bun sync && bun i --ignore-scripts && bun fix
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: sync components from upstream'
